name: Create Pr For Goravel
on:
  push:
    branches:
      - master
      - 'v1.*.x' # names mirror goravel/goravel
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-pr-for-goravel:
    runs-on: ubuntu-latest
    env:
      # goravel-lite and goravel/goravel share branch names, so the source branch is the base branch.
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Validate source branch
        run: |
          if [[ "${TARGET_BRANCH}" != "master" && ! "${TARGET_BRANCH}" =~ ^v[0-9]+\..+\.x$ ]]; then
            echo "::error::Unsupported branch '${TARGET_BRANCH}'. Pick master or a version branch such as v1.18.x."
            exit 1
          fi

      - name: Checkout goravel-lite
        uses: actions/checkout@v6
        with:
          path: goravel-lite
          fetch-depth: 1

      - name: Check target branch in goravel/goravel
        run: |
          status=0
          git ls-remote --exit-code --heads https://github.com/goravel/goravel.git "${TARGET_BRANCH}" > /dev/null || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error::goravel/goravel has no '${TARGET_BRANCH}' branch. Create it from master before syncing."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Could not reach goravel/goravel (git ls-remote exited ${status}). Retry the run."
            exit 1
          fi

      - name: Checkout goravel
        uses: actions/checkout@v6
        with:
          repository: goravel/goravel
          token: ${{ secrets.PAT }}
          path: goravel
          fetch-depth: 1
          ref: ${{ env.TARGET_BRANCH }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions[bot]"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Sync Files from goravel-lite to goravel
        run: |
          cd goravel-lite
          ./artisan package:install --all --default
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "ℹ️ No changes detected, exiting"
            echo "NO_CHANGES=true" >> $GITHUB_ENV
            exit 0
          fi

      - name: Push New Branch to goravel/goravel
        if: env.NO_CHANGES != 'true'
        run: |
          cd goravel
          PR_BRANCH_NAME="auto-sync/$(date +%Y%m%d%H%M%S)-${{ github.run_id }}"
          echo "PR_BRANCH_NAME=${PR_BRANCH_NAME}" >> $GITHUB_ENV
          
          git checkout -b $PR_BRANCH_NAME
          rsync -av --delete --exclude='.git/' --exclude='.github/' --exclude='main_test.go' ../goravel-lite/ ./
          git add .
          git commit -m "chore: sync from goravel-lite"
          
          # for i in {1..3}; do
          git push origin $PR_BRANCH_NAME
          #   echo "🔄 Retrying push (attempt $i)"
          #   sleep 5
          # done

      - name: Create PR
        if: env.NO_CHANGES != 'true'
        run: |
          echo "${{ secrets.PAT }}" | gh auth login --with-token
          
          cd goravel
          
          gh pr create \
            --base "${TARGET_BRANCH}" \
            --head "${PR_BRANCH_NAME}" \
            --title "chore: auto sync from goravel-lite" \
            --body "This PR is auto-created by GitHub Action in goravel-lite.
            - Source branch: goravel-lite@${TARGET_BRANCH}
            - Trigger event: ${{ github.event_name }}
            - Run ID: ${{ github.run_id }}
            - Sync time: $(date --utc +'%Y-%m-%d %H:%M:%S UTC')"
          
          echo "✅ PR created successfully!"
